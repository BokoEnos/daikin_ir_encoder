[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daikin-ir-encoder"
version = "0.1.0"
description = "Synthesize Daikin AC IR frames from scratch (3-frame and 1-frame transports)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["daikin", "ir", "infrared", "air-conditioner", "home-assistant"]
authors = [{ name = "Koen Bos" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/daikin_ir_encoder"]
